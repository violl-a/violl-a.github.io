<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ڤيولا - دخول</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #fff0f5 0%, #fce4ec 100%); display: flex; justify-content: center; align-items: center; height: 100vh; direction: rtl; padding: 1rem; }
        .login-box { background: white; border-radius: 40px; padding: 2rem 1.5rem; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 20px 35px rgba(233, 30, 99, 0.1); border: 1px solid #f8bbd9; }
        .login-box h2 { color: #e91e63; margin-bottom: 0.5rem; font-size: 1.8rem; }
        .login-box p { color: #b08a9e; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .input-group { margin-bottom: 1.2rem; text-align: right; }
        .input-group input { width: 100%; padding: 12px 15px; border: 1px solid #f8bbd9; border-radius: 30px; font-size: 1rem; font-family: 'Tajawal', sans-serif; transition: 0.3s; background: #FEFEFE; }
        .input-group input:focus { outline: none; border-color: #e91e63; box-shadow: 0 0 0 2px rgba(233, 30, 99, 0.2); }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #e91e63, #f06292); color: white; border: none; border-radius: 30px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(233, 30, 99, 0.3); }
        .error-message { color: #e91e63; font-size: 0.8rem; margin-top: 0.8rem; padding: 0.5rem; background: #fff0f5; border-radius: 20px; display: none; }
        .footer-note { margin-top: 1.5rem; font-size: 0.7rem; color: #b08a9e; }
        .footer-note strong { color: #e91e63; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>🌸 ڤيولا</h2>
    <p>دخول النظام</p>
    <div class="input-group"><input type="email" id="loginEmail" placeholder="البريد الإلكتروني" autocomplete="off"></div>
    <div class="input-group"><input type="password" id="loginPassword" placeholder="كلمة المرور" autocomplete="off"></div>
    <button id="loginButton">دخول</button>
    <div id="errorMsg" class="error-message"></div>
    <div class="footer-note">💜 تصميم وتطوير: <strong>Ahmad Kllawe</strong> © 2026</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD9BbiQfVKWazBtuXE-g0HRkkq87qNY080",
        authDomain: "enath11.firebaseapp.com",
        databaseURL: "https://enath11-default-rtdb.firebaseio.com",
        projectId: "enath11",
        storageBucket: "enath11.firebasestorage.app",
        messagingSenderId: "1092002726764",
        appId: "1:1092002726764:web:20626338f00627d82ae949"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(err => console.error(err));
    const loginBtn = document.getElementById('loginButton');
    const emailInput = document.getElementById('loginEmail');
    const passInput = document.getElementById('loginPassword');
    const errorDiv = document.getElementById('errorMsg');
    loginBtn.onclick = async () => {
        const email = emailInput.value.trim();
        const password = passInput.value;
        if (!email || !password) { errorDiv.innerText = 'الرجاء إدخال البريد الإلكتروني وكلمة المرور'; errorDiv.style.display = 'block'; return; }
        try {
            await auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
            let msg = 'بيانات الدخول غير صحيحة';
            if (err.code === 'auth/user-not-found') msg = '❌ لا يوجد حساب بهذا البريد الإلكتروني';
            else if (err.code === 'auth/wrong-password') msg = '❌ كلمة المرور غير صحيحة';
            else if (err.code === 'auth/invalid-email') msg = '❌ البريد الإلكتروني غير صالح';
            else if (err.code === 'auth/too-many-requests') msg = '❌ تم تعطيل الحساب مؤقتاً بسبب كثرة المحاولات';
            errorDiv.innerText = msg;
            errorDiv.style.display = 'block';
        }
    };
    auth.onAuthStateChanged((user) => { if (user) window.location.href = 'viola-panel-vq0w8hsg.html'; });
</script>
</body>
</html>
